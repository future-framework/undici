# nodejs/undici's .github/workflows/ci.yml: test via nodejs.yml (node-version 24, runs-on ubuntu-latest), for the Superaction scoreboard.
name: Superaction (GitHub)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test / github
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Node.js@24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Print version information
        run: |
          echo OS: $(node -p "os.version()")
          echo Node.js: $(node --version)
          echo npm: $(npm --version)
          echo git: $(git --version)
      - name: Install dependencies
        run: npm ci
      - name: Configure hosts file for WPT (Unix)
        run: |
          cd ${{ github.workspace }}/test/web-platform-tests/wpt
          python3 wpt make-hosts-file | sudo tee -a /etc/hosts
      - name: Generate PEM files
        run: npm run generate-pem
      - name: Test unit
        run: npm run test:unit
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test node-test
        run: npm run test:node-test
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test fetch
        run: npm run test:fetch
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test node-fetch
        run: npm run test:node-fetch
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test cache
        run: npm run test:cache
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test cache-interceptor
        run: npm run test:cache-interceptor
        env:
          CI: true
          NODE_OPTIONS: --experimental-sqlite
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test cache-tests
        run: npm run test:cache-tests
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test cookies
        run: npm run test:cookies
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test interceptors
        run: npm run test:interceptors
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test eventsource
        run: npm run test:eventsource
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test infra
        run: npm run test:infra
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test subresource-integrity
        run: npm run test:subresource-integrity
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test websocket
        run: npm run test:websocket
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test jest
        run: npm run test:jest
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
      - name: Test wpt
        run: npm run test:wpt
        env:
          CI: true
          NODE_V8_COVERAGE: ''
          UNDICI_NO_WASM_SIMD: ''
